# Local data plane for IntelliJ / Maven runs. Not production topology.
# Production: region-local PG + Kafka clusters (see docs/architecture/data-strategy.md).

name: hr-platform

services:
  postgres-amer:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hr_amer
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: hr
    ports:
      - "5432:5432"
    volumes:
      - pg-amer:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr -d hr_amer"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-emea:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hr_emea
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: hr
    ports:
      - "5433:5432"
    volumes:
      - pg-emea:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr -d hr_emea"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-apac:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hr_apac
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: hr
    ports:
      - "5434:5432"
    volumes:
      - pg-apac:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr -d hr_apac"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: hrplatformkraftlocal01
    ports:
      - "9092:9092"

volumes:
  pg-amer:
  pg-emea:
  pg-apac:
  redis:
