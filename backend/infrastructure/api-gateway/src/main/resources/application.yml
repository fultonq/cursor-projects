server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
        - id: employee-service
          uri: lb://employee-service
          predicates:
            - Path=/api/v1/employee/**
        - id: payroll-service
          uri: lb://payroll-service
          predicates:
            - Path=/api/v1/payroll/**
        - id: recruitment-service
          uri: lb://recruitment-service
          predicates:
            - Path=/api/v1/recruitment/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notification/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
