[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nycflights-ds"
version = "0.1.0"
description = "NYC Flights 2013 analysis with pandas, seaborn, scikit-learn, and Streamlit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "seaborn>=0.13",
    "matplotlib>=3.8",
    "streamlit>=1.32",
    "joblib>=1.3",
    "plotly>=5.18",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nycflights-ds = "nycflights_ds.__main__:main"

[tool.setuptools.packages.find]
include = ["nycflights_ds*", "nycflights"]

[tool.pyright]
include = ["nycflights_ds", "app", "tests"]
pythonVersion = "3.12"
extraPaths = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
