# Render Blueprint — Aether HR demo
# Connect this repo in the Render dashboard: New → Blueprint
# https://dashboard.render.com/blueprint/new

previews:
  generation: automatic

services:
  - type: web
    name: aether-hr
    runtime: static
    plan: free
    region: oregon
    branch: cursor/hr-platform-render-be44
    buildCommand: "true"
    staticPublishPath: ./deploy/web
    headers:
      - path: /*
        name: X-Frame-Options
        value: sameorigin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
